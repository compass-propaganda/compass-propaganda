name: Build oracle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/build-oracle.test.mjs
      - run: node scripts/build-oracle.mjs
      - run: node scripts/build-oracle.mjs --check
      - uses: actions/upload-artifact@v7
        with:
          name: oracle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
